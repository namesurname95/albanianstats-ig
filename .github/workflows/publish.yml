name: Publish to Instagram

on:
  schedule:
    # GitHub's scheduler can start runs late or skip them (it skipped 10-10 08:30), so several
    # starts through the morning; publish.py posts only between 08:00 and 12:00 Paris and only once
    # a day. Minutes avoid :00, when GitHub is busiest. 06:22 UTC = 08:22 CEST / 07:22 CET.
    - cron: "22,37,52 6 * * *"
    - cron: "7,22,37,52 7,8,9 * * *"
    - cron: "7,37 10-19 * * *"     # late-day backups, since GitHub's starts run hours late here
  workflow_dispatch:
    inputs:
      force:
        description: "Publish now (ignore the time window and the one-a-day guard)"
        type: boolean
        default: false
      dry_run:
        description: "Only show what would be published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish next image
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python publish.py
      - name: Record what was published
        run: |
          if [ -n "$(git status --porcelain posted.jsonl)" ]; then
            git config user.name "albanianstats-bot"
            git config user.email "actions@users.noreply.github.com"
            git add posted.jsonl
            git commit -m "published $(date -u +%F)"
            # the laptop may have pushed a batch meanwhile: rebase and retry, or tomorrow would repost
            for i in 1 2 3 4 5; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
              sleep $((i * 10))
            done
            echo "could not record posted.jsonl" >&2; exit 1
          fi
